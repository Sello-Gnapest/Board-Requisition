<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyson Properties Board Requisition</title>
    <style>
        :root {
            --primary-teal: #015151; /* Main Tyson brand color */
            --accent-green: #9acd32;
            --bg-off-white: #f5f5f5;
            --text-dark: #333;
            --border-grey: #ccc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-off-white);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 550px;
            margin: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .hidden { display: none !important; }

        /* Typography */
        h1 { margin: 0 0 0.5rem 0; font-size: 1.3rem; color: var(--primary-teal); text-align: center; }
        h2 { margin: 0 0 1rem 0; font-size: 1.2rem; color: #111; }
        .subtitle { color: #666; margin-bottom: 1.5rem; text-align: center; font-size: 0.95rem; }

        /* --- Image Preview Container --- */
        .image-preview-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 1rem 0 1.5rem 0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            background-color: #fff;
        }

        .image-preview-container img {
            width: 100%;
            max-width: 340px;
            height: auto;
            display: block;
            border-radius: 6px;
        }

        /* --- Global Button Styling --- */
        .btn {
            background-color: var(--primary-teal);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .btn:hover { background-color: #013e3e; }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #475569;
            margin-top: 1rem;
        }
        .btn-secondary:hover { background-color: #cbd5e1; }

        /* --- Form Styling --- */
        .form-group { margin-bottom: 1.25rem; }
        .flex-row { display: flex; gap: 1rem; flex-wrap: wrap; }
        .flex-item { flex: 1 1 200px; }

        label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem; }
        input[type="text"], input[type="tel"], select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-grey);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        textarea { resize: vertical; min-height: 100px; }

        .radio-group { display: flex; gap: 1.5rem; margin-top: 0.5rem; }
        .radio-option { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }

        fieldset {
            border: 1px solid var(--border-grey);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            background-color: #fafafa;
        }
        legend { padding: 0 0.5rem; font-weight: 600; color: var(--primary-teal); }

        .repeat-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            background: #e6f2f2;
            padding: 0.6rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary-teal);
            cursor: pointer;
        }
        .repeat-checkbox input { cursor: pointer; width: 16px; height: 16px; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- LANDING PAGE VIEW -->
    <div id="landingView" class="card">
        <h1>TYSON PROPERTIES BOARD REQUISITION APP</h1>
        <p class="subtitle">Request for your property advertising board to be made easily</p>
        
        <p style="text-align: center; color: #444; margin-top: 0.5rem; font-size: 0.85rem; font-weight: 600;">
            Below is an example of a requested For Sale board:
        </p>
        
        <!-- Image display container -->
        <div class="image-preview-container">
            <img src="Tyson For Sale Board.jpg" alt="Tyson Properties For Sale Board Preview">
        </div>

        <!-- Request Board/s Button -->
        <button class="btn" onclick="showForm()" style="text-transform: uppercase;">
            Request Boards
        </button>
    </div>

    <!-- FORM PAGE VIEW -->
    <div id="formView" class="hidden card">
        <h2>Board Requisition Form</h2>
        
        <form action="https://api.web3forms.com/submit" method="POST" id="requisitionForm">
            
            <!-- Web3Forms Key -->
            <input type="hidden" name="access_key" value="1c64725d-299c-4255-bd4f-25decd3f27f9">
            <input type="hidden" name="subject" value="New Tyson Properties Board Requisition">
            
            <!-- Agent Details Section -->
            <fieldset>
                <legend>Agent Details</legend>
                <div class="flex-row">
                    <div class="form-group flex-item">
                        <label for="agentName">Agent Name *</label>
                        <input type="text" id="agentName" name="Agent 1 Name" required placeholder="Chris Tyson">
                    </div>
                    <div class="form-group flex-item">
                        <label for="phoneNumber">Phone Number *</label>
                        <input type="tel" id="phoneNumber" name="Phone Number" required placeholder="061 234 5678">
                    </div>
                </div>
                <div class="form-group">
                    <label for="agent2Name">Agent 2 Name (Optional)</label>
                    <input type="text" id="agent2Name" name="Agent 2 Name" placeholder="e.g. Jane Doe">
                </div>
            </fieldset>

            <!-- Board Quantity Selection -->
            <fieldset>
                <legend>Order Quantity</legend>
                <div class="form-group">
                    <label for="boardQuantity">Boards Quantity *</label>
                    <select id="boardQuantity" name="Boards Quantity" required onchange="renderBoardConfigurations(this.value)">
                        <option value="">Select quantity...</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                    </select>
                </div>
            </fieldset>

            <!-- Dynamic Boards Container -->
            <div id="boardsContainer"></div>

            <!-- Global Options (Arrow & Notes) -->
            <div id="globalOptions" class="hidden">
                <fieldset>
                    <legend>Additional Details</legend>
                    <div class="form-group">
                        <label>Include Arrow?</label>
                        <div class="radio-group">
                            <label class="radio-option"><input type="radio" name="Include Arrow" value="Yes" checked> Yes</label>
                            <label class="radio-option"><input type="radio" name="Include Arrow" value="No"> No</label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="notes">Add a notes (Special Requests)</label>
                        <textarea id="notes" name="Special Requests / Notes" placeholder="Enter special requests or custom instructions..."></textarea>
                    </div>
                </fieldset>

                <button type="submit" class="btn">Submit Requisition</button>
            </div>

            <button type="button" class="btn btn-secondary" onclick="showLanding()">Back to Home</button>
        </form>
    </div>

</div>

<script>
    // Navigation Controls
    function showLanding() {
        document.getElementById('landingView').classList.remove('hidden');
        document.getElementById('formView').classList.add('hidden');
        document.getElementById('requisitionForm').reset();
        document.getElementById('boardsContainer').innerHTML = '';
        document.getElementById('globalOptions').classList.add('hidden');
    }

    function showForm() {
        document.getElementById('landingView').classList.add('hidden');
        document.getElementById('formView').classList.remove('hidden');
        window.scrollTo(0, 0);
    }

    // Dynamic Board Configurations Generator
    function renderBoardConfigurations(quantity) {
        const container = document.getElementById('boardsContainer');
        const globalOpts = document.getElementById('globalOptions');
        container.innerHTML = '';

        const qty = parseInt(quantity);
        if (!qty || qty < 1) {
            globalOpts.classList.add('hidden');
            return;
        }

        globalOpts.classList.remove('hidden');

        for (let i = 1; i <= qty; i++) {
            const boardFieldset = document.createElement('fieldset');
            
            let repeatCheckboxHTML = '';
            if (i > 1) {
                repeatCheckboxHTML = `
                    <label class="repeat-checkbox">
                        <input type="checkbox" id="repeatBoard${i}" onchange="toggleRepeatBoard(this, ${i})">
                        Repeat Board 1 Configuration
                    </label>
                `;
            }

            boardFieldset.innerHTML = `
                <legend>Board ${i} Configuration</legend>
                ${repeatCheckboxHTML}
                <div class="flex-row">
                    <div class="form-group flex-item">
                        <label for="boardType_${i}">Board Type</label>
                        <select id="boardType_${i}" name="Board ${i} - Type" onchange="syncIfRepeated(${i})">
                            <option value="For Sale">For Sale</option>
                            <option value="To Let">To Let</option>
                            <option value="On Show">On Show</option>
                            <option value="Sold">Sold</option>
                            <option value="Rented/Let By">Rented/Let By</option>
                            <option value="Commercial For Sale">Commercial For Sale</option>
                            <option value="Commercial To Let">Commercial To Let</option>
                            <option value="Commercial Sold">Commercial Sold</option>
                            <option value="Commercial Rented">Commercial Rented</option>
                        </select>
                    </div>
                    <div class="form-group flex-item">
                        <label for="stickers_${i}">Stickers</label>
                        <select id="stickers_${i}" name="Board ${i} - Sticker" onchange="syncIfRepeated(${i})">
                            <option value="Sole Mandate">Sole Mandate</option>
                            <option value="Joint Mandate">Joint Mandate</option>
                            <option value="CLS Mandate">CLS Mandate</option>
                            <option value="Open Mandate (No Sticker)">Open Mandate (No Sticker)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="mounting_${i}">Frame &amp; Mounting Option</label>
                    <select id="mounting_${i}" name="Board ${i} - Mounting" onchange="syncIfRepeated(${i})">
                        <option value="Metal Frame">Metal Frame</option>
                        <option value="Hanging Frame">Hanging Frame</option>
                        <option value="Cable Ties">Cable Ties</option>
                        <option value="Double sided Tape">Double sided Tape</option>
                    </select>
                </div>
            `;
            container.appendChild(boardFieldset);
        }
    }

    // Handles logic when "Repeat Board 1 Config" checkbox is toggled
    function toggleRepeatBoard(checkbox, boardIndex) {
        if (checkbox.checked) {
            copyBoard1To(boardIndex);
        }
    }

    // Copies values from Board 1 to target Board
    function copyBoard1To(targetIndex) {
        document.getElementById(`boardType_${targetIndex}`).value = document.getElementById('boardType_1').value;
        document.getElementById(`stickers_${targetIndex}`).value = document.getElementById('stickers_1').value;
        document.getElementById(`mounting_${targetIndex}`).value = document.getElementById('mounting_1').value;
    }

    // If Board 1 is modified, automatically update all boards that have "Repeat" checked
    function syncIfRepeated(sourceIndex) {
        if (sourceIndex === 1) {
            const qty = parseInt(document.getElementById('boardQuantity').value) || 1;
            for (let i = 2; i <= qty; i++) {
                const chk = document.getElementById(`repeatBoard${i}`);
                if (chk && chk.checked) {
                    copyBoard1To(i);
                }
            }
        }
    }
</script>

</body>
</html>
